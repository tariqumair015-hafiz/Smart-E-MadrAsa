<!DOCTYPE html>
<html lang="ur">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سمارٹ ای مدرسہ — کتاب شیئر</title>
  <style>
    body {
      background-color: #0a0f1c;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }
    .loader {
      width: 50px;
      height: 50px;
      border: 3px solid rgba(212, 175, 55, 0.2);
      border-top: 3px solid #d4af37;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }
    h2 { color: #d4af37; margin: 10px 0; font-size: 20px; }
    p { color: #88a; font-size: 14px; max-width: 280px; line-height: 1.5; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="loader"></div>
  <h2>کتاب لوڈ ہو رہی ہے...</h2>
  <p>اگر ایپ انسٹال ہے تو وہ خود کار طریقے سے کھل جائے گی۔ ورنہ آپ کو پلے اسٹور پر بھیج دیا جائے گا۔</p>

  <script>
    (function() {
      // Get the book ID from URL query parameters
      const params = new URLSearchParams(window.location.search);
      const bookId = params.get('id') || params.get('bookId');
      
      if (!bookId) {
        window.location.href = '/';
        return;
      }

      const playStoreUrl = 'https://play.google.com/store/apps/details?id=com.smartemadarsa.app';
      const appUri = 'smartemadarsa://book?id=' + bookId;
      const webFallback = '/?bookId=' + bookId;

      // Check if mobile device
      const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

      if (isMobile) {
        // Try opening native app
        window.location.href = appUri;

        // Set a timeout to redirect to Play Store if app doesn't open
        const start = Date.now();
        setTimeout(function() {
          // If browser tab is still active and visible (meaning app launch failed)
          if (!document.hidden && (Date.now() - start) < 2000) {
            window.location.href = playStoreUrl;
          }
        }, 1500);
      } else {
        // Redirect desktop users to the web app reader
        window.location.href = webFallback;
      }
    })();
  </script>
</body>
</html>
